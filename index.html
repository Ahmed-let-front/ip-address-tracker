<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="A powerful IP Address Tracker web application to lookup IP locations, view interactive maps, inspect ISP details, and track IP addresses quickly and accurately."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.png" type="image/png" />
    <title>IP Address Tracker</title>

  <body class="flex min-h-dvh flex-col">
    <header
      class="hero h-75 shrink-0 bg-[url('../assets/images/pattern-bg-mobile.png')] bg-cover bg-center bg-no-repeat px-6 pt-6 lg:h-70 lg:bg-[url('../assets/images/pattern-bg-desktop.png')] lg:pt-8"
    >
      <h1 class="text-center text-2xl font-medium text-white">
        IP Address Tracker
      </h1>

      <form
        id="search-form"
        role="search"
        class="mx-auto mt-7 flex max-w-139 lg:mt-7.5"
      >
        <label for="search-input" class="sr-only"
          >Search for any IP address or domain</label
        >
        <input
          id="search-input"
          type="text"
          name="query"
          autocomplete="off"
          placeholder="Search for any IP address or domain"
          class="h-14.5 min-w-0 flex-1 rounded-l-2xl bg-white px-4 text-input text-ellipsis text-gray-950 caret-gray-950 placeholder:text-gray-400 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-gray-950 sm:px-6 duration-500 transition-colors"
        />
        <button
          type="submit"
          aria-label="Search"
          class="grid w-14.5 shrink-0 cursor-pointer place-items-center rounded-r-2xl bg-black transition-colors hover:bg-gray-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
        >
          <img
            src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20width='11'%20height='14'%3e%3cpath%20fill='none'%20stroke='%23FFF'%20stroke-width='3'%20d='M2%201l6%206-6%206'/%3e%3c/svg%3e"
            alt=""
            width="11"
            height="14"
            aria-hidden="true"
          />
        </button>
        <button
          type="button"
          id="reset-location-btn"
          aria-label="Return to your country"
          title="Return to your location"
          class="cursor-pointer px-4 place-items-center rounded-xl bg-black text-white text-xs font-medium transition-colors hover:bg-gray-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white border-l border-gray-700 ml-4"
        >
          My Location
        </button>
      </form>
    </header>

    <main class="relative flex min-h-96 flex-1 flex-col">
      <div
        id="map"
        class="absolute inset-0 isolate z-0 bg-gray-400/20 brightness-[98%] contrast-[92%] saturate-[80%]"
        role="region"
        aria-label="Map showing the IP address location"
      ></div>

      <div
        class="relative z-10 -mt-33 px-6 lg:-mt-20 mx-auto max-w-277 rounded-2xl bg-white p-6 shadow-xl shadow-black/10 lg:p-0"
        role="region"
        aria-label="IP address details"
        aria-live="polite"
        aria-describedby="map"
      >
        <dl
          class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4 lg:gap-0"
        >
          <div class="stat">
            <dt class="stat-label">IP Address</dt>
            <dd id="ip-address" class="stat-value">------------</dd>
          </div>
          <div class="stat">
            <dt class="stat-label">Location</dt>
            <dd id="location" class="stat-value">------------</dd>
          </div>
          <div class="stat">
            <dt class="stat-label">Timezone</dt>
            <dd id="timezone" class="stat-value">------------</dd>
          </div>
          <div class="stat">
            <dt class="stat-label">ISP</dt>
            <dd id="isp" class="stat-value">----------</dd>
          </div>
        </dl>
      </div>
    </main>
  </body>
</html>
